<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halyk Voice Router</title>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="/static/css/tailwind.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body
    class="min-h-screen bg-slate-950 text-slate-100"
    x-data="voiceRouter()"
    x-init="connect()"
  >
    <main class="mx-auto max-w-7xl px-5 py-8 lg:px-8">
      <header
        class="mb-8 flex flex-wrap items-end justify-between gap-4 border-b border-slate-800 pb-6"
      >
        <div>
          <p
            class="text-xs font-semibold uppercase tracking-[0.24em] text-emerald-400"
          >
            HackAlem AI Hackathon
          </p>
          <h1 class="mt-2 text-3xl font-bold">Halyk Voice Router</h1>
        </div>
        <div class="flex items-center gap-2 text-sm text-slate-400">
          <span
            class="h-2 w-2 rounded-full"
            :class="connected ? 'bg-emerald-400' : 'bg-rose-400'"
          ></span
          ><span x-text="connected ? 'Live WebSocket' : 'Reconnecting'"
            >Connecting</span
          >
        </div>
      </header>
      <section class="grid gap-6 lg:grid-cols-[1.05fr_0.95fr]">
        <section class="panel flex min-h-[650px] flex-col p-5">
          <div class="mb-5 flex items-center justify-between">
            <div>
              <h2 class="text-lg font-semibold">Voice simulator</h2>
              <p class="text-sm text-slate-400">
                Русский / Қазақша / mixed speech
              </p>
            </div>
            <button
              @click="clearConversation()"
              class="icon-button"
              title="Clear conversation"
            >
              ↺
            </button>
          </div>
          <div class="flex-1 space-y-4 overflow-y-auto pr-1" id="transcript">
            <template x-for="item in conversation" :key="item.id"
              ><div
                class="flex"
                :class="item.role === 'user' ? 'justify-end' : 'justify-start'"
              >
                <div
                  class="max-w-[85%] rounded-lg px-4 py-3 text-sm leading-6"
                  :class="item.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-100'"
                  x-text="item.text"
                ></div></div
            ></template>
            <div x-show="isProcessing" class="text-sm text-emerald-300">
              Routing call context...
            </div>
          </div>
          <div class="mt-5 border-t border-slate-800 pt-5">
            <div class="flex items-center gap-3">
              <button
                @click="startListening()"
                class="mic-button"
                :class="listening && 'listening'"
                :title="listening ? 'Recording voice request' : 'Start voice request'"
              >
                <span x-text="listening ? '■' : '●'"></span></button
              ><input
                @keydown.enter="sendTranscript()"
                x-model="draft"
                class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-slate-500"
                placeholder="Type or dictate a customer request..."
              /><button
                @click="sendTranscript()"
                class="send-button"
                title="Send request"
              >
                Send
              </button>
              <button
                x-show="speaking"
                @click="stopSpeaking()"
                class="icon-button"
                title="Stop speech"
              >
                ■
              </button>
            </div>
            <p
              class="mt-3 text-xs text-slate-500"
              x-text="speechSupported ? speechStatus : 'Type a request; speech recognition is unavailable in this browser.'"
            ></p>
          </div>
        </section>
        <aside class="panel p-5">
          <div class="mb-6">
            <p
              class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400"
            >
              Supervisor trace
            </p>
            <h2 class="mt-1 text-lg font-semibold">Live routing decision</h2>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="metric">
              <span>Selected scenario</span
              ><strong
                class="text-emerald-300"
                x-text="trace.selected_scenario_id || 'Awaiting call'"
                >Awaiting call</strong
              >
            </div>
            <div class="metric">
              <span>Confidence</span
              ><strong
                x-text="trace.confidence ? Math.round(trace.confidence * 100) + '%' : '—'"
                >—</strong
              >
              <div class="mt-2 h-1.5 overflow-hidden bg-slate-700">
                <div
                  class="h-full bg-emerald-400 transition-all"
                  :style="`width: ${(trace.confidence || 0) * 100}%`"
                ></div>
              </div>
            </div>
          </div>
          <div class="mt-5">
            <h3 class="text-sm font-semibold">Latency breakdown</h3>
            <template x-for="latency in latencies" :key="latency.key"
              ><div class="mt-3">
                <div class="mb-1 flex justify-between text-xs text-slate-400">
                  <span x-text="latency.label"></span
                  ><span
                    x-text="(trace.latency[latency.key] ?? 0) + ' ms'"
                  ></span>
                </div>
                <div class="h-2 overflow-hidden bg-slate-800">
                  <div
                    class="h-full bg-indigo-400"
                    :style="`width: ${Math.min(100, (trace.latency[latency.key] || 0) / latency.max * 100)}%`"
                  ></div>
                </div></div
            ></template>
          </div>
          <div class="mt-6">
            <h3 class="text-sm font-semibold">LLM reasoning</h3>
            <div
              class="trace-box"
              x-text="trace.reasoning_ru || 'Decision rationale will appear here.'"
            ></div>
            <div
              class="trace-box text-slate-400"
              x-text="trace.reasoning_kz || 'Шешімнің негіздемесі осында көрінеді.'"
            ></div>
          </div>
          <div class="mt-6">
            <h3 class="text-sm font-semibold">Candidate scenarios</h3>
            <div class="mt-2 space-y-2">
              <template
                x-for="candidate in trace.candidates"
                :key="candidate.id"
                ><div
                  class="flex items-center justify-between border-b border-slate-800 pb-2 text-xs"
                >
                  <span x-text="candidate.title_ru"></span
                  ><span
                    class="text-emerald-300"
                    x-text="candidate.score"
                  ></span></div
              ></template>
            </div>
          </div>
          <div class="mt-6">
            <h3 class="text-sm font-semibold">Extracted slots</h3>
            <pre
              class="trace-box overflow-auto text-xs"
              x-text="JSON.stringify(trace.extracted_slots || {}, null, 2)"
            >
{}</pre
            >
          </div>
        </aside>
      </section>
    </main>
    <script src="/static/js/app.js"></script>
  </body>
</html>
