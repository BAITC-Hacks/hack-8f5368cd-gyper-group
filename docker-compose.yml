services:
  voice-router:
    build: .
    ports:
      - "${PORT:-8001}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL:-whisper-1}
      OPENAI_STT_FALLBACK_MODEL: ${OPENAI_STT_FALLBACK_MODEL:-whisper-1}
      ROUTER_CONFIDENCE_THRESHOLD: ${ROUTER_CONFIDENCE_THRESHOLD:-0.65}
    restart: unless-stopped
