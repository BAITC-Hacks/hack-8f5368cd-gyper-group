services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      ENABLE_TTS: ${ENABLE_TTS:-false}
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
